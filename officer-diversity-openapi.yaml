openapi: '3.0.2'
info:
  version: '1.0.0'
  title: 'njoagleod-api'
  description: >
    # NJ OAG Law Enforcement Officer Diversity data

    A cleaned-up copy of the NJ Attorney General's Law Enforcement Officer
    Diversity data (https://www.njoag.gov/policerecruiting/), as published in the
    [njoagleod data package for R](https://github.com/tor-gu/njoagleod) (version
    2.0.0). Officers are covered for 2021 to 2025; applicants and agency practices
    for 2022 to 2025. Field names and values are the same as in the R package.


    ## Conventions

    * Every reply has the form `{"data": [...], "links": {...}, "meta": {...}}`.
    `data` is always a list of flat records.

    * Collections are paginated with `page_number` (default 1) and `page_size`
    (default 100). Follow `links.next` until it is absent to retrieve every page.
    `links` carries the filters of the request.

    * A request that matches nothing, including a `year` or `agency_id` that isn't
    in the table, or a `page_number` past the last page, returns `404`. An unknown
    query parameter or an invalid value returns `400`.

    * Filters are combined with AND, and match values exactly: `true` and `false`
    in lower case, and levels as listed, in the same case. Missing values are
    `null`, and filters can not select `null`.


    ## Rows are combinations, not people

    `/officers` and `/applicants` are count tables. Each row is a combination of
    year, agency and characteristics, with the number of people who share it in
    `officer_count` or `applicant_count`. Counting rows counts combinations. Use
    `/counts/officers` and `/counts/applicants`, or sum the count field.


    ## Agencies

    Records identify agencies by `agency_id` only: the agency's identifier in
    [njlea](https://github.com/tor-gu/njlea), a registry of NJ law enforcement
    agencies (e.g. `NJLEA0199` is Newark PD). Agency names, counties, levels and
    functions, and the municipalities each agency serves, come from the njlea API
    ([njlea-api](https://tor-gu.com/apis/njlea.html), at `/nj/lea/*`): join on
    `agency_id` with `/nj/lea/agencies/{year}`. The same `agency_id` is the agency
    of `/nj/use_of_force/*`
    ([njoaguof-api](https://tor-gu.com/apis/njoaguof.html)).


    ## Caveats

    * The data is as reported by each agency, and some agency-years look
    incomplete; nothing is corrected. For example, Lakewood PD (`NJLEA0401`)
    reports 153 officers in 2021 but 20 in 2022 and 58 in 2025; Saddle Brook PD
    (`NJLEA0077`) reports about 30 officers every year until 2025, when it reports
    5; and Fair Lawn PD (`NJLEA0038`) reports 7 to 17 officers in 2021 to 2024 and
    56 in 2025.

    * The promotion columns are almost entirely `null` in 2021: 30,617 of the
    30,647 officers. Don't read `null` as "no". They are incomplete in later years
    too: in 2024, `promoted` is `null` for 4,261 of 31,627 officers.

    * `"Correctional Officer"` appears as a `new_rank` for the Cape May
    (`NJLEA0165`) and Hunterdon (`NJLEA0253`) sheriff's offices, although the data
    is meant to exclude correctional police officers.

servers:
  - url: "{protocol}://{server}"
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
      server:
        default: api.tor-gu.com
tags:
- name: officers
  description: Officer counts by agency, year, demographics and promotion
- name: applicants
  description: Applicant counts by agency, year, demographics, type and outcome
- name: counts
  description: Totals of officers and applicants
- name: practices
  description: Agency hiring and promotion practices
paths:
  /nj/officer_diversity/officers:
    summary: Get the officer table
    parameters:
    - $ref: '#/components/parameters/filter_year'
    - $ref: '#/components/parameters/filter_agency_id'
    - $ref: '#/components/parameters/filter_officer_race'
    - $ref: '#/components/parameters/filter_officer_age_range'
    - $ref: '#/components/parameters/filter_officer_gender'
    - $ref: '#/components/parameters/filter_eligible_for_promotion'
    - $ref: '#/components/parameters/filter_applied_for_promotion'
    - $ref: '#/components/parameters/filter_promoted'
    - $ref: '#/components/parameters/filter_old_rank'
    - $ref: '#/components/parameters/filter_new_rank'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The `officer` table of the R package, in its order. Each row is a combination of
        year, agency and officer characteristics, and `officer_count` is the number of
        officers who share it. To count officers use `/counts/officers`, or sum
        `officer_count`: counting rows counts combinations, not officers.
      responses:
        '200':
          description: Get the officer table
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"year": 2025, "agency_id": "NJLEA0199", "officer_race": "Black or African American", "officer_age_range": "25 or less", "officer_gender": "Female", "eligible_for_promotion": true, "applied_for_promotion": true, "promoted": false, "old_rank": null, "new_rank": null, "officer_count": 2}
                - {"year": 2025, "agency_id": "NJLEA0199", "officer_race": "Black or African American", "officer_age_range": "25 or less", "officer_gender": "Female", "eligible_for_promotion": true, "applied_for_promotion": true, "promoted": true, "old_rank": "Officer", "new_rank": "Sergeant", "officer_count": 1}
                links:
                  self: https://api.tor-gu.com/nj/officer_diversity/officers?agency_id=NJLEA0199&year=2025&page_number=1&page_size=2
                  next: https://api.tor-gu.com/nj/officer_diversity/officers?agency_id=NJLEA0199&year=2025&page_number=2&page_size=2
                meta:
                  record_count: 113
                  page_count: 57
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - officers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/officer_diversity/applicants:
    summary: Get the applicant table
    parameters:
    - $ref: '#/components/parameters/filter_year'
    - $ref: '#/components/parameters/filter_agency_id'
    - $ref: '#/components/parameters/filter_applicant_race'
    - $ref: '#/components/parameters/filter_applicant_age_range'
    - $ref: '#/components/parameters/filter_applicant_gender'
    - $ref: '#/components/parameters/filter_applicant_type'
    - $ref: '#/components/parameters/filter_outcome'
    - $ref: '#/components/parameters/filter_no_appointment_reason'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The `applicant` table of the R package, in its order. Each row is a combination of
        year, agency and applicant characteristics, and `applicant_count` is the number of
        applicants who share it. To count applicants use `/counts/applicants`, or sum
        `applicant_count`: counting rows counts combinations, not applicants.
      responses:
        '200':
          description: Get the applicant table
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"year": 2025, "agency_id": "NJLEA0199", "applicant_race": "Black or African American", "applicant_age_range": "25 or less", "applicant_gender": "Female", "applicant_type": "CSC Exam Exempt Direct Hire", "outcome": "Appointed to Agency", "no_appointment_reason": null, "applicant_count": 3}
                - {"year": 2025, "agency_id": "NJLEA0199", "applicant_race": "Black or African American", "applicant_age_range": "25 or less", "applicant_gender": "Male", "applicant_type": "CSC Exam Exempt Direct Hire", "outcome": "Appointed to Agency", "no_appointment_reason": null, "applicant_count": 6}
                links:
                  self: https://api.tor-gu.com/nj/officer_diversity/applicants?agency_id=NJLEA0199&outcome=Appointed%20to%20Agency&year=2025&page_number=1&page_size=2
                  next: https://api.tor-gu.com/nj/officer_diversity/applicants?agency_id=NJLEA0199&outcome=Appointed%20to%20Agency&year=2025&page_number=2&page_size=2
                meta:
                  record_count: 8
                  page_count: 4
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - applicants
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/officer_diversity/counts/officers:
    summary: Count officers, grouped by up to four columns
    parameters:
    - $ref: '#/components/parameters/byOfficers'
    - $ref: '#/components/parameters/filter_year'
    - $ref: '#/components/parameters/filter_agency_id'
    - $ref: '#/components/parameters/filter_officer_race'
    - $ref: '#/components/parameters/filter_officer_age_range'
    - $ref: '#/components/parameters/filter_officer_gender'
    - $ref: '#/components/parameters/filter_eligible_for_promotion'
    - $ref: '#/components/parameters/filter_applied_for_promotion'
    - $ref: '#/components/parameters/filter_promoted'
    - $ref: '#/components/parameters/filter_old_rank'
    - $ref: '#/components/parameters/filter_new_rank'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The sum of `officer_count` over the rows matching the filters, for each combination of the
        `by` columns, ordered by the `by` columns. Only combinations that occur are returned,
        and `null` is its own group. Values with declared levels are ordered as their levels,
        `false` before `true`, with `null` last.
      responses:
        '200':
          description: Count officers, grouped by up to four columns
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              examples:
                byYear:
                  summary: "by=year"
                  value:
                    data:
                    - {"year": 2021, "count": 30647}
                    - {"year": 2022, "count": 31067}
                    - {"year": 2023, "count": 31303}
                    - {"year": 2024, "count": 31627}
                    - {"year": 2025, "count": 31538}
                    links:
                      self: https://api.tor-gu.com/nj/officer_diversity/counts/officers?by=year&page_number=1&page_size=100
                    meta:
                      record_count: 5
                      page_count: 1
                byRace:
                  summary: "by=officer_race&year=2025&agency_id=NJLEA0199"
                  value:
                    data:
                    - {"officer_race": "Black or African American", "count": 377}
                    - {"officer_race": "Hispanic", "count": 541}
                    - {"officer_race": "Other", "count": 5}
                    - {"officer_race": "White", "count": 182}
                    links:
                      self: https://api.tor-gu.com/nj/officer_diversity/counts/officers?agency_id=NJLEA0199&by=officer_race&year=2025&page_number=1&page_size=100
                    meta:
                      record_count: 4
                      page_count: 1
                byYearAndPromoted:
                  summary: "by=year,promoted&page_size=4"
                  value:
                    data:
                    - {"year": 2021, "promoted": false, "count": 28}
                    - {"year": 2021, "promoted": true, "count": 2}
                    - {"year": 2021, "promoted": null, "count": 30617}
                    - {"year": 2022, "promoted": false, "count": 20704}
                    links:
                      self: https://api.tor-gu.com/nj/officer_diversity/counts/officers?by=year%2Cpromoted&page_number=1&page_size=4
                      next: https://api.tor-gu.com/nj/officer_diversity/counts/officers?by=year%2Cpromoted&page_number=2&page_size=4
                    meta:
                      record_count: 15
                      page_count: 4
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - counts
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/officer_diversity/counts/applicants:
    summary: Count applicants, grouped by up to four columns
    parameters:
    - $ref: '#/components/parameters/byApplicants'
    - $ref: '#/components/parameters/filter_year'
    - $ref: '#/components/parameters/filter_agency_id'
    - $ref: '#/components/parameters/filter_applicant_race'
    - $ref: '#/components/parameters/filter_applicant_age_range'
    - $ref: '#/components/parameters/filter_applicant_gender'
    - $ref: '#/components/parameters/filter_applicant_type'
    - $ref: '#/components/parameters/filter_outcome'
    - $ref: '#/components/parameters/filter_no_appointment_reason'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The sum of `applicant_count` over the rows matching the filters, for each combination of the
        `by` columns, ordered by the `by` columns. Only combinations that occur are returned,
        and `null` is its own group. Values with declared levels are ordered as their levels,
        `false` before `true`, with `null` last.
      responses:
        '200':
          description: Count applicants, grouped by up to four columns
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              examples:
                byOutcome:
                  summary: "by=year,outcome&year=2025"
                  value:
                    data:
                    - {"year": 2025, "outcome": "Appointed to Agency", "count": 2307}
                    - {"year": 2025, "outcome": "Not Appointed", "count": 20145}
                    - {"year": 2025, "outcome": "Pending", "count": 4729}
                    - {"year": 2025, "outcome": null, "count": 1536}
                    links:
                      self: https://api.tor-gu.com/nj/officer_diversity/counts/applicants?by=year%2Coutcome&year=2025&page_number=1&page_size=100
                    meta:
                      record_count: 4
                      page_count: 1
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - counts
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/officer_diversity/agency_practices:
    summary: Get agency hiring and promotion practices
    parameters:
    - $ref: '#/components/parameters/filter_year'
    - $ref: '#/components/parameters/filter_agency_id'
    - $ref: '#/components/parameters/filter_applications_received'
    - $ref: '#/components/parameters/filter_hiring_civil_service'
    - $ref: '#/components/parameters/filter_hire_method_civil_service_list'
    - $ref: '#/components/parameters/filter_hire_method_non_civil_service_list'
    - $ref: '#/components/parameters/filter_hire_method_intergovernmental_transfer'
    - $ref: '#/components/parameters/filter_hire_method_waiver'
    - $ref: '#/components/parameters/filter_hire_method_bcpo_direct'
    - $ref: '#/components/parameters/filter_hire_element_return_the_card'
    - $ref: '#/components/parameters/filter_hire_element_formal_application'
    - $ref: '#/components/parameters/filter_hire_element_interview_board'
    - $ref: '#/components/parameters/filter_hire_element_written_exam'
    - $ref: '#/components/parameters/filter_hire_element_local_preference'
    - $ref: '#/components/parameters/filter_hire_element_veteran_preference'
    - $ref: '#/components/parameters/filter_hire_element_drug_test'
    - $ref: '#/components/parameters/filter_hire_element_medical_exam'
    - $ref: '#/components/parameters/filter_hire_element_psychiatric_exam'
    - $ref: '#/components/parameters/filter_appointed_before_academy'
    - $ref: '#/components/parameters/filter_appointed_after_academy'
    - $ref: '#/components/parameters/filter_promotion_applications_received'
    - $ref: '#/components/parameters/filter_promotion_civil_service'
    - $ref: '#/components/parameters/filter_promotion_civil_service_all_ranks'
    - $ref: '#/components/parameters/filter_promotion_practice_civil_service_list'
    - $ref: '#/components/parameters/filter_promotion_practice_non_civil_service_list'
    - $ref: '#/components/parameters/filter_promotion_practice_interview'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The `agency_practice` table of the R package: each agency's answers to the NJ OAG
        questions about how it hires and promotes officers, one row per agency per year.
        `null` means not answered. Every answer is also a filter, so `meta.record_count`
        says how many agencies gave it.
      responses:
        '200':
          description: Get agency hiring and promotion practices
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"year": 2025, "agency_id": "NJLEA0002", "applications_received": true, "hiring_civil_service": true, "hire_method_civil_service_list": false, "hire_method_non_civil_service_list": false, "hire_method_intergovernmental_transfer": false, "hire_method_waiver": true, "hire_method_bcpo_direct": false, "hire_element_return_the_card": false, "hire_element_formal_application": true, "hire_element_interview_board": false, "hire_element_written_exam": false, "hire_element_local_preference": true, "hire_element_veteran_preference": true, "hire_element_drug_test": true, "hire_element_medical_exam": true, "hire_element_psychiatric_exam": true, "appointed_before_academy": true, "appointed_after_academy": false, "promotion_applications_received": false, "promotion_civil_service": true, "promotion_civil_service_all_ranks": true, "promotion_practice_civil_service_list": true, "promotion_practice_non_civil_service_list": false, "promotion_practice_interview": false}
                links:
                  self: https://api.tor-gu.com/nj/officer_diversity/agency_practices?hiring_civil_service=true&year=2025&page_number=1&page_size=1
                  next: https://api.tor-gu.com/nj/officer_diversity/agency_practices?hiring_civil_service=true&year=2025&page_number=2&page_size=1
                meta:
                  record_count: 202
                  page_count: 202
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - practices
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/officer_diversity/agency_practices/{year}/{agency_id}:
    summary: Get one agency's practices in a year
    parameters:
    - $ref: '#/components/parameters/pathYear'
    - $ref: '#/components/parameters/pathAgencyId'
    get:
      description: >
        The agency's row of `/agency_practices` for the year. Not paginated. An agency with
        no row for the year returns `404`.
      responses:
        '200':
          description: Get one agency's practices in a year
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"year": 2025, "agency_id": "NJLEA0199", "applications_received": true, "hiring_civil_service": true, "hire_method_civil_service_list": true, "hire_method_non_civil_service_list": true, "hire_method_intergovernmental_transfer": false, "hire_method_waiver": false, "hire_method_bcpo_direct": false, "hire_element_return_the_card": false, "hire_element_formal_application": true, "hire_element_interview_board": false, "hire_element_written_exam": false, "hire_element_local_preference": true, "hire_element_veteran_preference": false, "hire_element_drug_test": true, "hire_element_medical_exam": true, "hire_element_psychiatric_exam": true, "appointed_before_academy": false, "appointed_after_academy": true, "promotion_applications_received": true, "promotion_civil_service": true, "promotion_civil_service_all_ranks": true, "promotion_practice_civil_service_list": true, "promotion_practice_non_civil_service_list": false, "promotion_practice_interview": false}
                links:
                  self: https://api.tor-gu.com/nj/officer_diversity/agency_practices/2025/NJLEA0199
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - practices
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiversityFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
components:
  schemas:
    success:
      type: object
      required:
        - data
        - links
      properties:
        data:
          $ref: "#/components/schemas/data"
        links:
          $ref: "#/components/schemas/links"
        meta:
          $ref: "#/components/schemas/meta"
    data:
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/officer'
        - type: array
          items:
            $ref: '#/components/schemas/applicant'
        - type: array
          items:
            $ref: '#/components/schemas/agencyPractice'
        - type: array
          items:
            $ref: '#/components/schemas/officerCount'
        - type: array
          items:
            $ref: '#/components/schemas/applicantCount'
    links:
      type: object
      additionalProperties:
