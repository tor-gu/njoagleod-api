      description: "Race or ethnicity. As in the US Census, Hispanic people are `Hispanic` regardless of race"
      type: string
      enum:
        - "American Indian or Alaska Native"
        - "Asian"
        - "Black or African American"
        - "Hispanic"
        - "Native Hawaiian or other Pacific Islander"
        - "Other"
        - "Two or more races"
        - "White"
      example: "American Indian or Alaska Native"
    ageRange:
      description: "Age range"
      type: string
      enum:
        - "25 or less"
        - "26-35"
        - "36-45"
        - "46-55"
        - "56-65"
        - "66+"
      example: "25 or less"
    gender:
      description: "Gender"
      type: string
      enum:
        - "Male"
        - "Female"
        - "X or Non-Binary"
      example: "Male"
    rank:
      description: "Rank, standardized by the source"
      type: string
      enum:
        - "Police Aide"
        - "Officer"
        - "Corporal"
        - "Investigator"
        - "Detective"
        - "Special Agent"
        - "Correctional Officer"
        - "Sergeant"
        - "Detective Sergeant"
        - "Lieutenant"
        - "Detective Lieutenant"
        - "Captain"
        - "Detective Captain"
        - "Major"
        - "Lt. Colonel"
        - "Deputy Chief"
        - "Chief"
        - "Warden"
        - "Undersheriff"
        - "Sheriff"
      example: "Police Aide"
    applicantType:
      description: "How the applicant applied"
      type: string
      enum:
        - "Direct Hire"
        - "CSC Exam Exempt Direct Hire"
        - "Transfer"
        - "Waiver"
      example: "Direct Hire"
    outcome:
      description: "Outcome of the application"
      type: string
      enum:
        - "Appointed to Agency"
        - "Not Appointed"
        - "Pending"
      example: "Appointed to Agency"
    noAppointmentReason:
      description: "Reason the applicant was not appointed"
