      enum:
        - "Academy Failure"
        - "Applicant Withdrawal"
        - "Defer"
        - "Did not meet minimum qualifications"
        - "Failed background check - Criminal History"
        - "Failed background check - Financial"
        - "Failed Drug Test"
        - "Interview Panel Recommendation"
